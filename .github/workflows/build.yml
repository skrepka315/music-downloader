name: Build Geode Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone Geode SDK
        shell: pwsh
        run: git clone https://github.com/geode-sdk/geode.git --recursive --depth 1 -b v5.4.1 "$env:RUNNER_TEMP\geode-sdk"

      - name: Install Geode CLI and binaries
        shell: pwsh
        run: |
          curl -L https://github.com/geode-sdk/cli/releases/download/v3.7.4/geode-cli-v3.7.4-win.zip -o cli.zip
          7z x cli.zip -ocli
          $cliPath = "$env:GITHUB_WORKSPACE\cli"
          Add-Content $env:GITHUB_PATH $cliPath
          $env:PATH = "$cliPath;$env:PATH"
          $configDir = "$env:APPDATA\geode"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          $sdkPath = "$env:RUNNER_TEMP\geode-sdk"
          Set-Content "$configDir\config.json" "{`"default_profile`":`"ci`",`"profiles`":[{`"name`":`"ci`",`"gd_path`":`"C:\\dummy`",`"geode_path`":`"`"}],`"sdk_path`":`"$($sdkPath -replace '\\','\\\\')`"}"
          & "$cliPath\geode.exe" sdk install-binaries
        env:
          GEODE_SDK: ${{ runner.temp }}\geode-sdk

      - name: Configure
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
        env:
          GEODE_SDK: ${{ runner.temp }}\geode-sdk

      - name: Build
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo
        env:
          GEODE_SDK: ${{ runner.temp }}\geode-sdk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-downloader
          path: build/**/*.geode
