CLI v3.7.4 не читает наш формат конфига. Попробуем другую версию CLI:
name: Build Geode Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone Geode SDK
        shell: pwsh
        run: |
          git clone https://github.com/geode-sdk/geode.git --recursive --depth 1 -b v5.4.1 "$env:RUNNER_TEMP\geode-sdk"

      - name: Download binaries manually
        shell: pwsh
        run: |
          $sdkPath = "$env:RUNNER_TEMP\geode-sdk"
          $binPath = "$sdkPath\bin\nightly"
          New-Item -ItemType Directory -Force -Path $binPath | Out-Null

          Write-Host "Downloading loader binaries..."
          $baseUrl = "https://github.com/geode-sdk/geode/releases/download/v5.4.1"

          $files = @(
            "geode.dll",
            "Geode.lib",
            "GeodeBootstrapper.dll"
          )

          foreach ($file in $files) {
            $url = "$baseUrl/$file"
            $dest = "$binPath\$file"
            Write-Host "Downloading $file..."
            try {
              curl -L $url -o $dest --silent
              if (Test-Path $dest) {
                Write-Host "OK: $file"
              }
            } catch {
              Write-Host "Skip: $file"
            }
          }

          Get-ChildItem $binPath

      - name: Configure
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGEODE_DONT_BUILD_TEST_MODS=ON
        env:
          GEODE_SDK: ${{ runner.temp }}\geode-sdk

      - name: Build
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo
        env:
          GEODE_SDK: ${{ runner.temp }}\geode-sdk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-downloader
          path: build/**/*.geode
```
